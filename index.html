<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTA6 Remake</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #160d2d, #ef5b82); color: #fff; }
    main { width: min(760px, calc(100% - 32px)); padding: 56px 32px; text-align: center; border: 1px solid #ffffff44; border-radius: 24px; background: #120d25aa; box-shadow: 0 24px 80px #0005; }
    h1 { margin: 0 0 12px; font-size: clamp(2.4rem, 8vw, 5rem); letter-spacing: .04em; }
    p { margin: 0 auto 28px; max-width: 520px; font-size: 1.1rem; line-height: 1.6; color: #ffe8f0; }
    a { display: inline-block; padding: 13px 20px; border-radius: 999px; background: #fff; color: #201032; font-weight: 700; text-decoration: none; }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <h1>GTA6 Remake</h1>
    <p>Een kleine startpagina voor het project. Deze site is klaar om via GitHub Pages gepubliceerd te worden.</p>
    <a href="https://github.com/BerendLuypaert/GTA6REMAKE">Bekijk de repository</a>
  </main>
</body>
</html>
